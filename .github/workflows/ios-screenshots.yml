name: iOS UI screenshots

on:
  workflow_dispatch:
    inputs:
      include_landscape_screenshots:
        description: Capture landscape screenshot variants in addition to the default portrait set
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

env:
  RUST_TOOLCHAIN: 1.98.1
  RUST_TARGETS: ios-arm64-device-and-simulator
  XCODE_VERSION: 16.4
  RUST_FRAMEWORK_PATH: Frameworks/MankiAnkiRust.xcframework

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v7
      - name: Restore SwiftPM build cache
        uses: actions/cache@v6
        with:
          path: .build
          key: linux-swiftpm-${{ hashFiles('Package.swift', 'Package.resolved', 'Manki/DueBadgeCount.swift', 'Manki/ReviewCardSettings.swift', 'Manki/StudySettings.swift', 'Tests/**') }}
          restore-keys: |
            linux-swiftpm-
      - name: Run portable Swift tests
        run: scripts/test-linux.sh

  screenshots:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      SIMULATOR_NAME: iPhone 16 Pro
      SIMULATOR_OS: "18.5"
      RESULT_BUNDLE: TestResults/MankiScreenshots.xcresult
      SCCACHE_CACHE_SIZE: 5G
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v7

      - name: Restore complete MankiAnkiRust XCFramework cache
        id: rust-framework-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.RUST_FRAMEWORK_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ env.RUST_TARGETS }}-manki-anki-rust-${{ hashFiles('AnkiRustBridge/Cargo.toml', 'AnkiRustBridge/Cargo.lock', 'AnkiRustBridge/src/**', 'AnkiRustBridge/include/**', 'scripts/bootstrap-anki-rslib.sh', 'scripts/build-anki-xcframework.sh') }}

      # Pull-request caches are scoped to refs/pull/*/merge. Reuse a
      # content-addressed artifact when GitHub's cache scoping prevents a hit.
      - name: Download reusable MankiAnkiRust XCFramework artifact
        if: steps.rust-framework-cache.outputs.cache-hit != 'true'
        uses: actions/github-script@v8
        env:
          ARTIFACT_NAME: MankiAnkiRust-xcframework-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ env.RUST_TARGETS }}-${{ hashFiles('AnkiRustBridge/Cargo.toml', 'AnkiRustBridge/Cargo.lock', 'AnkiRustBridge/src/**', 'AnkiRustBridge/include/**', 'scripts/bootstrap-anki-rslib.sh', 'scripts/build-anki-xcframework.sh') }}
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: process.env.ARTIFACT_NAME,
              per_page: 100,
            });
            const artifact = artifacts
              .filter(candidate => !candidate.expired)
              .sort((left, right) => new Date(right.created_at) - new Date(left.created_at))[0];
            core.info(artifact
              ? `Reusing artifact ${artifact.id}`
              : `No reusable artifact named ${process.env.ARTIFACT_NAME} was found`);
            if (!artifact) return;
            const archive = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });
            const fs = require('fs');
            fs.writeFileSync('/tmp/manki-anki-rust.zip', Buffer.from(archive.data));
            await exec.exec('mkdir', ['-p', process.env.RUST_FRAMEWORK_PATH]);
            await exec.exec('ditto', [
              '-x', '-k', '/tmp/manki-anki-rust.zip', process.env.RUST_FRAMEWORK_PATH,
            ]);

      - name: Check for a complete MankiAnkiRust XCFramework
        id: rust-framework
        run: |
          if test -f "$RUST_FRAMEWORK_PATH/Info.plist" \
            && test -d "$RUST_FRAMEWORK_PATH/ios-arm64" \
            && test -d "$RUST_FRAMEWORK_PATH/ios-arm64-simulator"; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore simulator MankiAnkiRust XCFramework cache
        id: simulator-framework-cache
        if: steps.rust-framework.outputs.restored != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.RUST_FRAMEWORK_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-rust-${{ env.RUST_TOOLCHAIN }}-ios-arm64-simulator-manki-anki-rust-${{ hashFiles('AnkiRustBridge/Cargo.toml', 'AnkiRustBridge/Cargo.lock', 'AnkiRustBridge/src/**', 'AnkiRustBridge/include/**', 'scripts/bootstrap-anki-rslib.sh', 'scripts/build-anki-xcframework.sh') }}

      # Artifacts are repository-wide, so this also reuses a simulator build
      # from the default branch when Actions cache scoping prevents a hit.
      - name: Download reusable simulator MankiAnkiRust XCFramework artifact
        if: steps.rust-framework.outputs.restored != 'true' && steps.simulator-framework-cache.outputs.cache-hit != 'true'
        uses: actions/github-script@v8
        env:
          ARTIFACT_NAME: MankiAnkiRust-simulator-xcframework-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-rust-${{ env.RUST_TOOLCHAIN }}-ios-arm64-simulator-${{ hashFiles('AnkiRustBridge/Cargo.toml', 'AnkiRustBridge/Cargo.lock', 'AnkiRustBridge/src/**', 'AnkiRustBridge/include/**', 'scripts/bootstrap-anki-rslib.sh', 'scripts/build-anki-xcframework.sh') }}
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: process.env.ARTIFACT_NAME,
              per_page: 100,
            });
            const artifact = artifacts
              .filter(candidate => !candidate.expired)
              .sort((left, right) => new Date(right.created_at) - new Date(left.created_at))[0];
            core.info(artifact
              ? `Reusing artifact ${artifact.id}`
              : `No reusable artifact named ${process.env.ARTIFACT_NAME} was found`);
            if (!artifact) return;
            const archive = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });
            const fs = require('fs');
            fs.writeFileSync('/tmp/manki-anki-rust-simulator.zip', Buffer.from(archive.data));
            await exec.exec('mkdir', ['-p', process.env.RUST_FRAMEWORK_PATH]);
            await exec.exec('ditto', [
              '-x', '-k', '/tmp/manki-anki-rust-simulator.zip', process.env.RUST_FRAMEWORK_PATH,
            ]);

      - name: Check for a simulator MankiAnkiRust XCFramework
        id: simulator-framework
        if: steps.rust-framework.outputs.restored != 'true'
        run: |
          if test -f "$RUST_FRAMEWORK_PATH/Info.plist" \
            && test -d "$RUST_FRAMEWORK_PATH/ios-arm64-simulator"; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust and iOS targets
        if: steps.rust-framework.outputs.restored != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Set up sccache
        if: steps.rust-framework.outputs.restored != 'true'
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install build dependencies
        if: steps.rust-framework.outputs.restored != 'true'
        run: brew install protobuf

      - name: Prepare Anki rslib sources
        if: steps.rust-framework.outputs.restored != 'true'
        run: scripts/bootstrap-anki-rslib.sh

      - name: Build simulator MankiAnkiRust framework
        if: steps.rust-framework.outputs.restored != 'true' && steps.simulator-framework.outputs.restored != 'true'
        run: scripts/build-anki-xcframework.sh simulator

      # Persist this immediately: a UI-test failure should not force the next
      # run to rebuild the already validated simulator Rust framework.
      - name: Save simulator MankiAnkiRust XCFramework cache
        if: steps.rust-framework.outputs.restored != 'true' && steps.simulator-framework.outputs.restored != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.RUST_FRAMEWORK_PATH }}
          key: ${{ steps.simulator-framework-cache.outputs.cache-primary-key }}

      - name: Upload reusable simulator MankiAnkiRust XCFramework
        if: steps.rust-framework.outputs.restored != 'true' && steps.simulator-framework.outputs.restored != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MankiAnkiRust-simulator-xcframework-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-rust-${{ env.RUST_TOOLCHAIN }}-ios-arm64-simulator-${{ hashFiles('AnkiRustBridge/Cargo.toml', 'AnkiRustBridge/Cargo.lock', 'AnkiRustBridge/src/**', 'AnkiRustBridge/include/**', 'scripts/bootstrap-anki-rslib.sh', 'scripts/build-anki-xcframework.sh') }}
          path: ${{ env.RUST_FRAMEWORK_PATH }}/
          if-no-files-found: error
          retention-days: 7

      - name: Boot fixed simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"]
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-" + os.environ["SIMULATOR_OS"].replace(".", "-")
          matches = [device for device in devices.get(runtime, []) if device["name"] == os.environ["SIMULATOR_NAME"]]
          if not matches:
              raise SystemExit("fixed simulator not installed: {} (iOS {})".format(os.environ["SIMULATOR_NAME"], os.environ["SIMULATOR_OS"]))
          print(matches[0]["udid"])
          ')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl erase "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Run UI screenshot tests
        env:
          MANKI_CAPTURE_LANDSCAPE: ${{ inputs.include_landscape_screenshots && '1' || '0' }}
        run: |
          rm -rf "$RESULT_BUNDLE"
          mkdir -p "$(dirname "$RESULT_BUNDLE")"
          xcodebuild test \
            -project Manki.xcodeproj \
            -scheme Manki \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:MankiUITests \
            -resultBundlePath "$RESULT_BUNDLE" \
            ARCHS=arm64

      - name: Report sccache statistics
        if: always() && steps.rust-framework.outputs.restored != 'true'
        run: sccache --show-stats

      - name: Build device MankiAnkiRust framework
        if: success() && steps.rust-framework.outputs.restored != 'true'
        run: scripts/build-anki-xcframework.sh device

      - name: Save complete MankiAnkiRust XCFramework cache
        if: success() && steps.rust-framework.outputs.restored != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.RUST_FRAMEWORK_PATH }}
          key: ${{ steps.rust-framework-cache.outputs.cache-primary-key }}

      - name: Upload reusable MankiAnkiRust XCFramework
        if: success() && steps.rust-framework.outputs.restored != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: MankiAnkiRust-xcframework-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_VERSION }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ env.RUST_TARGETS }}-${{ hashFiles('AnkiRustBridge/Cargo.toml', 'AnkiRustBridge/Cargo.lock', 'AnkiRustBridge/src/**', 'AnkiRustBridge/include/**', 'scripts/bootstrap-anki-rslib.sh', 'scripts/build-anki-xcframework.sh') }}
          path: ${{ env.RUST_FRAMEWORK_PATH }}/
          if-no-files-found: error
          retention-days: 7

      - name: Build unsigned iPhone application
        run: |
          rm -rf Build/UnsignedDevice Build/UnsignedPayload Manki-unsigned.ipa
          xcodebuild build \
            -project Manki.xcodeproj \
            -scheme Manki \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath Build/UnsignedDevice \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64
          mkdir -p Build/UnsignedPayload/Payload
          cp -R Build/UnsignedDevice/Build/Products/Release-iphoneos/Manki.app \
            Build/UnsignedPayload/Payload/
          (cd Build/UnsignedPayload && ditto -c -k --sequesterRsrc --keepParent Payload ../../Manki-unsigned.ipa)
          unzip -Z1 Manki-unsigned.ipa > Build/unsigned-ipa-contents.txt
          grep -Fxq 'Payload/Manki.app/Manki' Build/unsigned-ipa-contents.txt

      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v7
        with:
          name: Manki-unsigned-iphone
          path: Manki-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Extract screenshot attachments
        if: always()
        continue-on-error: true
        run: scripts/extract-xcresult-screenshots.py "$RESULT_BUNDLE" screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manki-ios-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload complete test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manki-ios-xcresult
          path: ${{ env.RESULT_BUNDLE }}
          if-no-files-found: warn
          retention-days: 7
