name: Seed shared Rust framework cache

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Export the branch-scoped cache, or import it into main
        required: true
        default: export
        type: choice
        options:
          - export
          - import

permissions:
  actions: write
  contents: read

env:
  RUST_CACHE_KEY: macOS-ARM64-xcode-16.4-manki-anki-rust-e0bbc58a7a42ef444bd8b5f99264390d087856d01f65d42f28445fce5814750a
  TRANSFER_ARTIFACT: manki-anki-rust-cache-transfer-e0bbc58a7a42ef444bd8b5f99264390d087856d01f65d42f28445fce5814750a
  RUST_FRAMEWORK_PATH: Frameworks/MankiAnkiRust.xcframework

jobs:
  export:
    if: inputs.mode == 'export'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Restore branch-scoped Rust framework cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.RUST_FRAMEWORK_PATH }}
          key: ${{ env.RUST_CACHE_KEY }}

      - name: Require the source cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "The requested cache is not available to this branch ref." >&2
          exit 1

      - name: Upload cache contents for the main-branch import
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TRANSFER_ARTIFACT }}
          path: ${{ env.RUST_FRAMEWORK_PATH }}/
          if-no-files-found: error
          retention-days: 1

  import:
    if: inputs.mode == 'import'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Download the exported cache artifact
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: process.env.TRANSFER_ARTIFACT,
              per_page: 100,
            });
            const artifact = artifacts
              .filter(candidate => !candidate.expired)
              .sort((left, right) => new Date(right.created_at) - new Date(left.created_at))[0];
            if (!artifact) core.setFailed('No exported cache artifact was found. Run export first.');
            if (!artifact) return;
            const archive = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });
            const fs = require('fs');
            fs.writeFileSync('/tmp/manki-rust-cache-transfer.zip', Buffer.from(archive.data));
            await exec.exec('mkdir', ['-p', process.env.RUST_FRAMEWORK_PATH]);
            await exec.exec('ditto', [
              '-x', '-k', '/tmp/manki-rust-cache-transfer.zip', process.env.RUST_FRAMEWORK_PATH,
            ]);

      - name: Save the cache in main scope
        uses: actions/cache/save@v6
        with:
          path: ${{ env.RUST_FRAMEWORK_PATH }}
          key: ${{ env.RUST_CACHE_KEY }}
